<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RSS Bangla</title><style>body{font-family:system-ui;max-width:720px;margin:0 auto;padding:20px}li{margin:6px 0}</style></head><body><h1>📡 RSS Bangla</h1><p>Bangla RSS ফিডের তালিকা: <a href="feeds.json">feeds.json</a></p><ul id="list"><li><a href="https://www.prothomalo.com/feed/">Prothom Alo</a></li><li><a href="https://www.bbc.com/bengali/index.xml">BBC Bangla</a></li><li><a href="https://www.banglanews24.com/rss/rss.xml">banglanews24.com</a></li><li><a href="https://feeds.bbci.co.uk/news/rss.xml">BBC News</a></li><li><a href="https://hnrss.org/frontpage">Hacker News</a></li></ul><script>fetch('feeds.json').then(r=>r.json()).then(d=>{const feeds=d.feeds||[];if(!feeds.length)return;const ul=document.getElementById('list');ul.innerHTML='';feeds.forEach(f=>{const li=document.createElement('li');const a=document.createElement('a');a.href=f.url;a.textContent=f.name||f.url;a.target='_blank';li.appendChild(a);ul.appendChild(li);});}).catch(()=>{/* static list above stays visible when fetch fails (e.g. opened as a file) */});</script></body></html>
