<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RSS Bangla</title><style>body{font-family:system-ui;max-width:720px;margin:0 auto;padding:20px}li{margin:6px 0}</style></head><body><h1>📡 RSS Bangla</h1><p>Bangla RSS ফিডের তালিকা: <a href="feeds.json">feeds.json</a></p><ul id="list"><li>লোড হচ্ছে…</li></ul><script>fetch('feeds.json').then(r=>r.json()).then(d=>{const ul=document.getElementById('list');ul.innerHTML='';(d.feeds||d).forEach(f=>{const li=document.createElement('li');const a=document.createElement('a');a.href=f.url;a.textContent=f.name||f.url;a.target='_blank';li.appendChild(a);ul.appendChild(li);});}).catch(()=>{document.getElementById('list').innerHTML='<li>feeds.json লোড হয়নি — ফাইলটি রিপোতে আছে কিনা দেখুন।</li>';});</script></body></html>
